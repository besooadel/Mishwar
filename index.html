<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مشوار</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0878F9">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--blue:#0878F9;--navy:#12345A;--yellow:#FFC928;--bg:#F4F7FB;--card:#fff;--bd:#E4EBF4;--green:#13B981;--red:#F04444;--purple:#7C3AED;--mut:#7B8CA3;--pale:#FFF6D9}
@media (prefers-color-scheme:dark){:root{--bg:#0B1A2E;--card:#12253F;--bd:#223859;--navy:#EAF1FB;--mut:#8DA2BF;--pale:#3A3112}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--navy);display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;position:relative;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;animation:in .3s;padding-top:env(safe-area-inset-top,0px)}
.scr.on{display:flex}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{background:linear-gradient(160deg,#0878F9,#0560C9);color:#fff;padding:14px 18px 54px;border-radius:0 0 28px 28px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.logo{width:44px;height:44px;border-radius:14px;background:var(--yellow);display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;box-shadow:0 6px 18px rgba(18,52,90,.07)}
.pad{padding:0 16px}
.btn{width:100%;border:0;border-radius:18px;background:var(--yellow);color:#12345A;font:800 18px Cairo,sans-serif;padding:15px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px rgba(255,201,40,.45);cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}gle('act',m==='pick');$('#rowD').classList.toggle('act',m==='dest');$('#hint').textContent=(mk.pick&&mk.dest)?HINT.done:HINT[m]}
function initMap(){
  map=L.map('map',{zoomControl:false}).setView([30.0444,31.2357],13);
  tiles().addTo(map);
  map.on('click',e=>setPoint(mode,e.latlng));
  $('#zin').onclick=()=>map.zoomIn();$('#zout').onclick=()=>map.zoomOut();
  $('#zloc').onclick=$('#gps').onclick=e=>{e.stopPropagation();locate()};
  $('#rowP').onclick=()=>setMode('pick');
  $('#rowD').onclick=()=>setMode('dest');
  $('#sbtn').onclick=e=>{e.stopPropagation();searchDest()};
  $('#dq').onkeydown=e=>{if(e.key==='Enter'){const f=$('#sug .sg');f?f.click():searchDest()}};
  $('#pq').onkeydown=e=>{if(e.key==='Enter'){const f=$('#sug .sg');if(f)f.click()}};
  $('#pq').oninput=()=>{setMode('pick');suggest('pick')};
  $('#dq').oninput=()=>{setMode('dest');suggest('dest')};
  $('#pq').onfocus=()=>{setMode('pick');$('#pq').select()};
  $('#dq').onfocus=()=>{setMode('dest');$('#dq').select()};
  map.on('click',()=>$('#sug').replaceChildren());
  $('#onmap').onclick=()=>setCM(!cm);
  $('#cok').onclick=()=>{setPoint(mode,map.getCenter());setCM(false)};
  setMode('pick');locate();
}
function locate(){
  $('#pq').value='بنحدد موقعك...';
  if(!navigator.geolocation){$('#pq').value='حدد موقعك على الخريطة';return}
  navigator.geolocation.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);map.setView(ll,16);setPoint('pick',ll)},
    ()=>{$('#pq').value='فعّل الموقع أو اضغط على الخريطة';setMode('pick')},{enableHighAccuracy:true,timeout:9000});
}
function setCM(on){
  cm=on;$('#cpin').style.display=on?'block':'none';$('#cok').style.display=on?'block':'none';
  $('#onmap').textContent=on?'إلغاء':'حدد على الخريطة';
  if(on){$('#cpin').innerHTML=pinSvg(mode==='pick'?'#13B981':'#F04444');$('#sug').replaceChildren();$('#hint').textContent='حرّك الخريطة لحد ما الدبوس يبقى على المكان، وبعدين اضغط تأكيد';$('#map').scrollIntoView({behavior:'smooth',block:'center'})}
  else setMode(mode);
}
function setAddr(k,t){addr[k]=t;$(k==='pick'?'#pq':'#dq').value=t}
function setPoint(k,ll,label){
  if(mk[k])mk[k].setLatLng(ll);
  else{mk[k]=L.marker(ll,{icon:pinIcon(k==='pick'?'#13B981':'#F04444'),draggable:true}).addTo(map);mk[k].on('dragend',()=>setPoint(k,mk[k].getLatLng()))}
  label?setAddr(k,label):reverse(k,ll);calcRoute();
  setMode(k==='pick'&&!mk.dest?'dest':mode);
  if(k==='dest'&&!mk.pick){setMode('pick');$('#hint').textContent='حدد نقطة الانتقال كمان (اكتب العنوان أو اضغط على الخريطة)'}
}
const lbl=(a,fb)=>{
  if(!a)return fb;
  const ps=[a.amenity||a.tourism||a.shop||'',a.road||a.pedestrian||a.footway||'',a.suburb||a.quarter||a.neighbourhood||a.city_district||'',a.city||a.town||a.village||a.state_district||a.state||''].filter(Boolean);
  return [...new Set(ps)].slice(0,3).join('، ')||fb;
};
async function reverse(k,ll){
  const fb=ll.lat.toFixed(4)+' , '+ll.lng.toFixed(4);
  const set=t=>setAddr(k,t);
  set('...');
  try{
    const j=await fj(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=ar&lat=${ll.lat}&lon=${ll.lng}`);
    set(lbl(j.address,(j.display_name||'').split(/[،,]\s*/).slice(0,3).join('، ')||fb));
  }catch(e){set(fb)}
}
const hav=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dg=t(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function fj(u,ms=7000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  finally{clearTimeout(t)}
}
async function geocode(q){
  const c=map.getCenter(),enc=encodeURIComponent(q);
  const jobs=[
    fj(`https://photon.komoot.io/api/?q=${enc}&limit=10&lat=${c.lat}&lon=${c.lng}`).then(j=>(j.features||[]).filter(x=>String(x.properties.countrycode||'EG').toUpperCase()==='EG').map(x=>{const p=x.properties;
      return{lat:x.geometry.coordinates[1],lon:x.geometry.coordinates[0],title:p.name||p.street||p.district||p.city||q,
        sub:[p.name&&p.street?p.street:'',p.district,p.city||p.county,p.state].filter(Boolean).join('، ')}})),
    fj(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=eg&accept-language=ar&q=${enc}&viewbox=${c.lng-.6},${c.lat+.6},${c.lng+.6},${c.lat-.6}`).then(j=>j.map(x=>{
      const a=x.address||{},t=x.name||a.road||a.suburb||a.city||(x.display_name||'').split(/[،,]\s*/)[0];
      return{lat:+x.lat,lon:+x.lon,title:t,sub:lbl({road:a.road&&a.road!==t?a.road:'',suburb:a.suburb||a.quarter||a.neighbourhood||a.city_district,city:a.city||a.town||a.village||a.state_district||a.state},'')}}))
  ];
  const res=(await Promise.allSettled(jobs)).filter(r=>r.status==='fulfilled');
  if(!res.length)throw new Error('geocoders unavailable');
  const seen=new Set(),out=[];
  for(const x of res.flatMap(r=>r.value)){const key=(+x.lat).toFixed(3)+','+(+x.lon).toFixed(3);if(seen.has(key))continue;seen.add(key);out.push(x)}
  const ql=q.toLowerCase(),m=x=>x.title.toLowerCase().includes(ql)?0:1;
  out.sort((a,b)=>(m(a)-m(b))||(hav({lat:a.lat,lng:a.lon},c)-hav({lat:b.lat,lng:b.lon},c)));
  return out.slice(0,8);
}
let st,sseq=0;
function sugMsg(t){const d=document.createElement('div');d.className='mut';d.style.padding='12px';d.textContent=t;$('#sug').replaceChildren(d)}
function suggest(k){
  clearTimeout(st);const q=$(k==='pick'?'#pq':'#dq').value.trim();
  if(q.length<2){$('#sug').replaceChildren();return}
  st=setTimeout(async()=>{
    const my=++sseq;sugMsg('بندوّر...');
    try{const r=await geocode(q);if(my!==sseq)return;renderSug(k,r)}
    catch(e){console.warn(e);if(my===sseq)sugMsg('تعذّر الوصول لخدمة البحث، اضغط على الخريطة لتحديد المكان')}
  },450);
}
function pickResult(k,x){
  const ll=L.latLng(x.lat,x.lon);$('#sug').replaceChildren();setMode(k);
  setPoint(k,ll,[x.title,(x.sub||'').split('، ')[0]].filter(Boolean).join('، '));
  if(!(mk.pick&&mk.dest))map.setView(ll,17);
  $('#map').scrollIntoView({behavior:'smooth',block:'center'});
}
function renderSug(k,list){
  const box=$('#sug');box.replaceChildren();
  if(!list.length){sugMsg('مالقيناش نتايج، جرّب كلمات تانية أو اضغط على الخريطة');return}
  list.forEach(x=>{
    const b=document.createElement('button'),sp=document.createElement('span'),t=document.createElement('b'),m=document.createElement('small');
    b.className='sg';b.innerHTML=ic('pin');t.textContent=x.title;m.textContent=x.sub||'';sp.append(t,m);b.append(sp);
    b.onclick=()=>pickResult(k,x);box.append(b);
  });
}
async function searchDest(){
  const q=$('#dq').value.trim();if(!q)return;
  try{const r=await geocode(q);if(r.length)pickResult('dest',r[0]);else $('#hint').textContent='مالقيناش المكان ده، جرّب اسم تاني أو اضغط على الخريطة'}
  catch(e){$('#hint').textContent='تعذّر الوصول لخدمة البحث، اضغط على الخريطة'}
}
let rseq=0;
async function calcRoute(){
  if(!mk.pick||!mk.dest){updInfo();return}
  const my=++rseq,a=mk.pick.getLatLng(),b=mk.dest.getLatLng();let km,min,pts=null;
  RD={km:0,min:0};$('#dist').textContent=$('#dur').textContent=$('#fare').textContent='...';$('#order').disabled=true;
  try{
    const j=await fj(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`,7000);
    const rt=j.routes[0];km=rt.distance/1000;min=rt.duration/60;pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
  }catch(e){console.warn('osrm failed',e);km=hav(a,b)*1.3;min=km/30*60}
  if(my!==rseq)return;
  if(routeL)map.removeLayer(routeL);
  routeL=L.polyline(pts||[a,b],{color:'#0878F9',weight:5,opacity:.9}).addTo(map);
  map.fitBounds(routeL.getBounds(),{padding:[40,40]});
  RD={km:Math.max(.1,Math.round(km*10)/10),min:Math.max(1,Math.round(min))};updInfo();
}
function updInfo(){
  const has=RD.km&&mk.pick&&mk.dest;
  $('#dist').textContent=has?RD.km+' كم':'—';$('#dur').textContent=has?RD.min+' دقيقة':'—';
  $('#fare').textContent=has?calc()+' ج.م':'—';$('#order').disabled=!has;
}
$('#pay').onclick=e=>{const k=e.target.closest('[data-p]');if(!k)return;pm=k.dataset.p;$$('#pay div').forEach(x=>x.classList.remove('sel'));k.classList.add('sel')};

/* ===== الطلب والتتبع ===== */
/* ===== الطلب والتتبع (عبر قاعدة البيانات) ===== */
let RID=ls.get('mw_ride',null),RATE_ID=null,poll=null,lastSt=null,trackBuilt=false,drv=null;
const stopPoll=()=>{clearInterval(poll);poll=null};
const ERR={busy:'كل الكباتن مشغولين في رحلات دلوقتي، جرّب بعد شوية',already_open:'عندك رحلة شغالة بالفعل',offline:'الكابتن مش متاح حالياً، جرّب بعد شوية',no_customer:'بياناتك مش موجودة، من حسابي اختار تغيير الحساب وسجّل تاني',bad_input:'بيانات الرحلة مش مظبوطة، حدد الأماكن تاني'};
$('#order').onclick=async()=>{
  $('#oerr').textContent='';$('#order').disabled=true;
  await loadSettings();
  const a=mk.pick.getLatLng(),d=mk.dest.getLatLng();
  try{
    const {data,error}=await sb.rpc('create_ride',{p_customer:CU.id,p_plat:a.lat,p_plng:a.lng,p_paddr:addr.pick,p_dlat:d.lat,p_dlng:d.lng,p_daddr:addr.dest,p_km:RD.km,p_min:RD.min,p_pay:pm});
    if(error)throw error;
    if(data.status==='ok'){RID=data.ride_id;ls.set('mw_ride',RID);lastSt='searching';trackBuilt=false;show('search');startPoll();return}
    $('#oerr').textContent=ERR[data.status]||'حصل خطأ، جرّب تاني';
  }catch(e){console.warn(e);$('#oerr').textContent='تعذّر إرسال الطلب، اتأكد من النت'}
  updInfo();
};
function startPoll(){
  stopPoll();
  const run=async()=>{try{const {data}=await sb.rpc('get_ride',{p_ride:RID,p_customer:CU.id});if(data)onRide(data);else endRide()}catch(e){console.warn(e)}};
  run();poll=setInterval(run,3000);
}
function endRide(msg){stopPoll();RID=null;ls.del('mw_ride');lastSt=null;trackBuilt=false;if(msg)$('#oerr').textContent=msg;show('home');updInfo()}
async function cancelRide(){try{await sb.rpc('cancel_ride',{p_ride:RID,p_customer:CU.id})}catch(e){}endRide()}
$('#cancel').onclick=cancelRide;
$('#cancelTrip').onclick=()=>{if(confirm('تلغي الرحلة؟'))cancelRide()};
function fillCaptain(c){$('#tname').textContent=c.name;$('#rname').textContent=c.name;$('#tcar').textContent=c.car;$('#tplate').textContent=c.plate;$('#tav').textContent=(c.name||'?').charAt(0);$('#tcall').href='tel:'+c.phone}
function buildTrack(r){
  const a=L.latLng(r.pickup_lat,r.pickup_lng),b=L.latLng(r.dest_lat,r.dest_lng);
  if(!tmap){tmap=L.map('tmap',{zoomControl:false});tiles().addTo(tmap)}
  tmap.eachLayer(l=>{if(!l._url)tmap.removeLayer(l)});
  L.marker(a,{icon:pinIcon('#13B981')}).addTo(tmap);L.marker(b,{icon:pinIcon('#F04444')}).addTo(tmap);
  L.polyline([a,b],{color:'#0878F9',weight:4,dashArray:'8 8'}).addTo(tmap);
  drv=null;tmap.invalidateSize();tmap.fitBounds(L.latLngBounds([a,b]),{padding:[40,40]});trackBuilt=true;
}
function onRide(r){
  const st=r.status,cap=r.captain||{};
  if(st==='searching'){if(!$('#search').classList.contains('on'))show('search');lastSt=st;return}
  if(st==='cancelled'){endRide(lastSt==='searching'?'مفيش كابتن قبل الطلب دلوقتي، جرّب تاني بعد شوية':'الرحلة اتلغت');return}
  if(st==='completed'){finish(r);return}
  fillCaptain(cap);
  if(!$('#track').classList.contains('on')){show('track');trackBuilt=false}
  if(!trackBuilt)setTimeout(()=>{if(!trackBuilt&&RID)buildTrack(r)},80);
  lastSt=st;
  $('#tstat').textContent={accepted:'الكابتن في الطريق إليك',arrived:'الكابتن وصل ✔',in_trip:'الرحلة شغالة'}[st];
  $('#cancelTrip').style.display=st==='in_trip'?'none':'flex';
  if(trackBuilt&&cap.lat!=null){const ll=L.latLng(cap.lat,cap.lng);
    if(!drv)drv=L.marker(ll,{icon:L.divIcon({className:'',html:'<div style="font-size:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))">🚕</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(tmap);else drv.setLatLng(ll)}
  let eta='';
  if(st==='accepted'&&cap.lat!=null){const km=hav({lat:cap.lat,lng:cap.lng},{lat:r.pickup_lat,lng:r.pickup_lng})*1.3;eta='≈ '+Math.max(1,Math.round(km/30*60))+' دقيقة'}
  if(st==='arrived')eta='وصل';
  if(st==='in_trip')eta='في الطريق للوجهة';
  $('#teta').textContent=eta;
  $('#tinfo').textContent=st==='arrived'?'الانتظار بيتحسب '+r.wait_price+' ج.م للدقيقة':'';
}
function finish(r){
  stopPoll();ls.del('mw_ride');RATE_ID=RID;RID=null;lastSt=null;trackBuilt=false;
  const b=r.breakdown||{},R=n=>Math.round(n*100)/100;
  const rows=[['وصول الكابتن إليك',+b.pickup||0],['المسافة '+r.distance_km+' كم × '+b.km_price,r.distance_km*b.km_price],['انتظار '+r.wait_min+' د × '+b.wait_price,r.wait_min*b.wait_price]];
  const sum=rows.reduce((t,x)=>t+x[1],0);
  if(r.fare>sum+.5)rows.push(['تعديل للحد الأدنى للرحلة',r.fare-sum]);
  $('#paid').innerHTML=rows.map(x=>`<div class="row sp"><span>${x[0]}</span><b>${R(x[1])} ج.م</b></div>`).join('')+`<div class="row sp" style="border-top:1px solid var(--bd);padding-top:6px"><b>الإجمالي (${r.pay_method==='cash'?'كاش':'كارت'})</b><b style="color:var(--blue);font-size:18px">${r.fare} ج.م</b></div>`;
  const t=ls.get('mw_trips',[]);t.unshift({to:r.dest_addr||'وجهة',date:new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long'}),fare:r.fare,pay:r.pay_method});ls.set('mw_trips',t.slice(0,30));
  show('rate');
}
$('#stars').innerHTML=[1,2,3,4,5].map(n=>ic('star').replace('class="i"',`class="i" data-n="${n}"`)).join('');
$('#stars').onclick=e=>{const s=e.target.closest('svg');if(!s)return;$$('#stars svg').forEach((x,i)=>x.classList.toggle('on',i<+s.dataset.n))};
$('#done').onclick=async()=>{
  const n=$$('#stars svg.on').length;
  if(n&&RATE_ID){try{await sb.rpc('rate_ride',{p_ride:RATE_ID,p_customer:CU.id,p_rating:n,p_review:$('#rtxt').value})}catch(e){}}
  RATE_ID=null;$('#rtxt').value='';$$('#stars svg').forEach(x=>x.classList.remove('on'));updInfo();show('home');
};
function renderTrips(){
  const t=ls.get('mw_trips',[]);
  $('#tl').innerHTML=t.length?t.map(x=>`<div class="card row"><span style="color:var(--red)">${ic('pin')}</span><div style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" class="tt"></b><div class="mut">${x.date}</div></div><div style="text-align:left"><b>${x.fare} ج.م</b><div class="mut">${x.pay==='cash'?'كاش':'كارت'}</div></div></div>`).join(''):'<div class="card mut" style="text-align:center;padding:30px">لسه معملتش أي رحلة</div>';
  $$('#tl .tt').forEach((e,i)=>e.textContent=t[i].to||'وجهة');
}

/* ===== التشغيل ===== */
setTimeout(()=>CU?boot():show('login'),1700);
</script>
